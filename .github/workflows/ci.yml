name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile release modules
        run: python -m compileall -q examples scripts swift tests
      - name: Run release contract tests
        run: python -m unittest tests.test_release_contract
