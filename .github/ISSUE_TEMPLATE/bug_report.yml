name: Bug report
description: Report a reproducible code, data-contract, or documentation problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private paths, restricted videos, or unpublished benchmark media.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal command or example and the relevant configuration.
      render: shell
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Git revision
      placeholder: Commit SHA or branch
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, PyTorch, CUDA, GPU, and operating system versions.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
